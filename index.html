<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>持久走ラボ</title>
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#122033; --sub:#5d6b7c; --line:#e2e7ee; --soft:#eef2f7;
  --navy:#13315c; --navy2:#1d4580; --orange:#f26a21; --orange-soft:#fff1e8;
  --green:#1a9a6c; --green-soft:#e6f6ef; --red:#d64545; --red-soft:#fdecec; --blue:#2f6fd6;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#demobar{background:#fff7d6;border-bottom:1px solid #f0dc8a;padding:6px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#demobar button{border:1px solid #d9c16a;background:#fff;border-radius:999px;padding:2px 12px;cursor:pointer}
#demobar button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
header.top{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.02em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--orange);display:grid;place-items:center}
#who{font-size:13px;opacity:.9;text-align:right}
nav#tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5;padding:0 8px}
nav#tabs button{border:0;background:none;padding:13px 16px;cursor:pointer;font-weight:600;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap}
nav#tabs button.on{color:var(--navy);border-bottom-color:var(--orange)}
main{max-width:1100px;margin:0 auto;padding:18px 14px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3{font-size:15px;margin:14px 0 8px}
.muted{color:var(--sub);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .lb{font-size:12px;color:var(--sub);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;line-height:1.2;margin-top:2px}
.kpi .s{font-size:12px;color:var(--sub)}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:0}
.hero .lb,.hero .s{color:#c9d6ea}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--navy)}
.pill.o{background:var(--orange-soft);color:#b8480c}.pill.g{background:var(--green-soft);color:#11714e}.pill.r{background:var(--red-soft);color:#a62a2a}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.acc{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.dang{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--sub)}
input[type=text],input[type=number],input[type=date],input[type=email],select,textarea{border:1px solid #cfd7e2;border-radius:9px;padding:8px 10px;background:#fff;min-width:0;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #9db8e6;border-color:#7d9fd8}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid #cfd7e2;border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;min-width:38px}
.seg button+button{border-left:1px solid #e2e7ee}
.seg button.on{background:var(--navy);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:var(--soft);text-align:left;padding:8px;font-size:12px;color:var(--sub);white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none}
table.t td{padding:8px;border-top:1px solid var(--line);white-space:nowrap}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#f8fafd}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.r{text-align:right}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:inherit;font-size:12px;fill:#5d6b7c}
.empty{padding:28px;text-align:center;color:var(--sub);background:var(--soft);border-radius:10px}
details.rec{scroll-margin-top:64px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
details.rec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details.rec>summary::-webkit-details-marker{display:none}
details.rec[open]>summary{border-bottom:1px solid var(--line)}
details.rec .body{padding:14px}
.big{font-size:24px;font-weight:800}
.note{background:var(--orange-soft);border-left:4px solid var(--orange);padding:10px 12px;border-radius:8px;font-size:14px}
.note.b{background:#eaf1fc;border-color:var(--blue)}
.note.g{background:var(--green-soft);border-color:var(--green)}
.cmt{background:#eaf1fc;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}
/* 計測 */
.sw{text-align:center}
.sw .clock{font-size:clamp(56px,16vw,110px);font-weight:800;letter-spacing:.01em;line-height:1.05;margin:8px 0}
.sw .sub{font-size:16px;color:var(--sub)}
.tap{width:100%;max-width:520px;height:150px;border-radius:24px;border:0;font-size:32px;font-weight:800;color:#fff;cursor:pointer;margin:14px auto;display:block;touch-action:manipulation;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.tap:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.tap.start{background:var(--green)}.tap.lap{background:var(--orange)}.tap.goal{background:var(--red)}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;background:#fff}
.chip.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.now{border-color:var(--orange);color:#b8480c;font-weight:700}
.runners{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:340px;overflow:auto}
.runners button{text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;cursor:pointer}
.runners button:hover{border-color:var(--navy)}
.runners button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
#modal[hidden]{display:none}
#modal .box{background:#fff;border-radius:16px;max-width:900px;width:100%;padding:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;transition:transform .25s;z-index:60;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--orange)}
.loading{padding:60px;text-align:center;color:var(--sub)}
.step{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.step b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:13px}
@media (max-width:600px){ main{padding:12px 10px 80px} .card{padding:14px} .kpi .v{font-size:24px} }
/* A3まとめ */
.pv{width:100%;aspect-ratio:1587/1123;overflow:hidden;position:relative;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.pv .sheet{position:absolute;left:0;top:0;transform-origin:0 0}
.sheet{width:1587px;height:1123px;background:#fff;color:#122033;padding:34px 40px;display:flex;flex-direction:column;font-size:15px;line-height:1.55;overflow:hidden}
.sheet .hd{display:flex;align-items:flex-end;gap:24px;border-bottom:4px solid #13315c;padding-bottom:12px}
.sheet .hd h1{margin:0;font-size:36px;letter-spacing:.04em;color:#13315c}
.sheet .hd .meta{font-size:16px;color:#3c4b5d}
.sheet .hd .badge{margin-left:auto;text-align:center;background:#f26a21;color:#fff;border-radius:14px;padding:6px 20px}
.sheet .hd .badge b{display:block;font-size:34px;line-height:1.1}
.sheet .cols{flex:1;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:22px;margin-top:16px;min-height:0}
.sheet .col{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.sheet h2{margin:0;font-size:19px;color:#fff;background:#13315c;border-radius:8px;padding:5px 12px}
.sheet h2 span{color:#f9a46f;margin-right:6px}
.sheet .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet .kp div{border:1px solid #dfe5ed;border-radius:10px;padding:6px 10px}
.sheet .kp small{display:block;font-size:12px;color:#5d6b7c;font-weight:700}
.sheet .kp b{font-size:22px}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}
.sheet th{background:#eef2f7;text-align:left;padding:4px 6px;font-size:12px;color:#5d6b7c}
.sheet td{border-top:1px solid #e2e7ee;padding:4px 6px}
.sheet .hy{border:1.5px solid #dfe5ed;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.sheet .hy .q{font-weight:800;font-size:16px}
.sheet .hy .s{font-size:13px;color:#3c4b5d;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sheet .hy .d{font-size:13.5px;background:#f6f8fb;border-radius:8px;padding:6px 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sheet .box{border:1.5px solid #dfe5ed;border-radius:12px;padding:10px 12px;white-space:pre-wrap;font-size:14.5px;overflow:hidden}
.sheet .box.lg{flex:1}
.sheet .lb{font-size:13px;font-weight:800;color:#b8480c;margin-bottom:2px}
.sheet .pill{font-size:12px}
.sheet svg.chart text{fill:#5d6b7c}
.sheet.rec .cols{grid-template-columns:360px 1fr}
.sheet .rtw{flex:1;min-height:0}
.sheet table.rt{font-size:13.5px;table-layout:fixed;height:100%}
.sheet table.rt td{vertical-align:top;padding:6px 7px}
.sheet table.rt th{height:30px}
.sheet table.rt .ref{white-space:pre-wrap;font-size:15px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.sheet table.rt tr:nth-child(even) td{background:#fafbfd}
#printArea{display:none}
#pdfHost{position:fixed;left:-20000px;top:0}
@media print{
  nav,#demobar,.noprint{display:none!important}
  @page{size:A3 landscape;margin:0}
  body.print-a3{background:#fff}
  body.print-a3>*:not(#printArea){display:none!important}
  body.print-a3 #printArea{display:block}
  body.print-a3 .sheet{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="demobar" hidden></div>
<header class="top">
  <div class="brand"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4" r="2"/><path d="M8 21l3-6 3 3v3M6 12l3-3 4 1 3 3 3 1M11 15l-2-4"/></svg></span><span id="appTitle">持久走ラボ</span></div>
  <div id="who"></div>
</header>
<nav id="tabs"></nav>
<main id="main"><div class="loading">読み込み中…</div></main>
<div id="modal" hidden></div>
<div id="toast"></div>

<script>
'use strict';
/* ================= 基本ユーティリティ ================= */
const IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(sec, dec = 0) {
  if (sec == null || isNaN(sec)) return '—';
  const neg = sec < 0; sec = Math.abs(sec);
  const p = Math.pow(10, dec); let v = Math.round(sec * p) / p;
  const m = Math.floor(v / 60); const s = v - m * 60;
  let ss = s.toFixed(dec); const [i, f] = ss.split('.');
  return (neg ? '-' : '') + m + ':' + i.padStart(2, '0') + (f ? '.' + f : '');
}
function parseTime(str) {
  str = String(str || '').trim().replace(/：/g, ':').replace(/分/, ':').replace(/秒/, '').replace(/[’'′]/, ':').replace(/[”"″]/, '');
  if (!str) return null;
  if (str.includes(':')) { const [m, s] = str.split(':'); const v = Number(m) * 60 + Number(s || 0); return isNaN(v) ? null : v; }
  const v = Number(str); return isNaN(v) ? null : v;
}
const pad2 = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const md = d => d ? Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10)) : '';
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const r1 = n => Math.round(n * 10) / 10;
function corr(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = mean(xs), my = mean(ys); let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
  return (sxx && syy) ? sxy / Math.sqrt(sxx * syy) : null;
}
function linreg(xs, ys) { const mx = mean(xs), my = mean(ys); let sxy = 0, sxx = 0; xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; }); const b = sxx ? sxy / sxx : 0; return { a: my - b * mx, b }; }
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 2600); }
function api(fn, ...args) {
  if (IS_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(e => rej(e))[fn](...args));
  return new Promise((res, rej) => setTimeout(() => { try { res(JSON.parse(JSON.stringify(Mock[fn](...args)))); } catch (e) { rej(e); } }, 120));
}
const errMsg = e => (e && e.message) ? e.message : String(e);
const sortRecs = rs => rs.slice().sort((a, b) => (a.date + a.created).localeCompare(b.date + b.created));
const DIST = g => g === 'F' ? 1000 : 1500;
const gk = x => String(x).replace(/^中/, '0').replace(/^高/, '1');
const cmpJa = (a, b) => gk(a).localeCompare(gk(b), 'ja', { numeric: true });
const stuKey = x => [x.grade, x.cls, x.no];
const cmpStu = (a, b) => cmpJa(a.grade, b.grade) || cmpJa(a.cls, b.cls) || (a.no - b.no);
const cn = x => `${x.grade} ${x.cls}組${x.no}番`;
const cls2 = k => { const [g, c] = k.split('-'); return `${g} ${c}組`; };
const GL = g => g === 'F' ? '女子' : '男子';

/* ================= 探究で使う要因 ================= */
const STRATEGIES = ['前半から積極的に', '前半は抑えて後半上げる', '一定ペースを守る', '前の人について行く', '特に決めていない'];
const FACTORS = [
  { key: 'pacing', label: 'ペース配分（ラップから自動判定）', type: 'pace' },
  { key: 'order', label: '練習の回数（くり返すと伸びるか）', unit: '回目', type: 'num' },
  { key: 'other', label: 'その他（自分で決めた要因）', type: 'none' }
];
const OLD_F = { sleep: '前日の睡眠時間', breakfast: '朝食', condition: '体調', warmup: 'ウォームアップ', weekly: '自主練習量', strategy: '作戦', rpe: 'きつさ' };
const SUMKEY = '__summary';
const RECKEY = '__recsum';
const realH = a => a.filter(h => !String(h.factor).startsWith('__'));
const fLabel = k => (FACTORS.find(f => f.key === k) || { label: OLD_F[k] || k }).label;

/* ================= 状態 ================= */
const S = { boot: null, tab: null, sw: null, f: { grade: '', cls: '', gender: '' }, sort: { key: 'no', dir: 1 }, editHyp: null, aFactor: 'pacing', pick: { cls: '' } };
const isT = () => S.boot && S.boot.teacher;
const plan = g => (g === 'F' ? S.boot.settings.lapF : S.boot.settings.lapM);

/* ================= 採点 ================= */
// 新体力テスト（12〜19歳）項目別得点表：持久走（スポーツ庁）。記録は秒未満切り上げで判定
const OFFICIAL = { M: [[10, 299], [9, 316], [8, 333], [7, 355], [6, 382], [5, 410], [4, 450], [3, 499], [2, 560], [1, 1e9]], F: [[10, 229], [9, 242], [8, 259], [7, 277], [6, 296], [5, 318], [4, 342], [3, 374], [2, 417], [1, 1e9]] };
function offScore(g, t) { if (t == null) return null; const sec = Math.ceil(t - 1e-9); for (const [p, lim] of OFFICIAL[g]) if (sec <= lim) return p; return 1; }
function offNext(g, t) { const cur = offScore(g, t); if (cur == null || cur >= 10) return null; const row = OFFICIAL[g].find(r => r[0] === cur + 1); return { points: cur + 1, limit: row[1], need: Math.ceil(t - 1e-9) - row[1] }; }
function scoreRows(g) { return S.boot.scoreTable.filter(r => r.gender === g).sort((a, b) => b.points - a.points); }
function scoreFor(g, t) {
  if (t == null) return null;
  const rows = scoreRows(g); if (!rows.length) return null;
  for (const r of rows.slice().sort((a, b) => a.limit - b.limit)) if (t <= r.limit + 1e-9) return r.points;
  return Math.min(...rows.map(r => r.points));
}
function nextGoal(g, t) {
  const cur = scoreFor(g, t); if (cur == null) return null;
  const better = scoreRows(g).filter(r => r.points > cur).sort((a, b) => a.points - b.points)[0];
  return better ? { points: better.points, limit: better.limit, need: t - better.limit } : null;
}
function basisTime(rs) { if (!rs.length) return null; return S.boot.settings.basis === 'latest' ? sortRecs(rs).slice(-1)[0].time : Math.min(...rs.map(r => r.time)); }

/* ================= ペース分析 ================= */
function lapDists(rec, g) {
  const p = plan(g); const n = rec.laps.length;
  if (n === p.length) return p;
  return rec.laps.map(() => DIST(g) / n);
}
function pacing(rec, g) {
  if (!rec.laps || rec.laps.length < 2) return null;
  const d = lapDists(rec, g); const half = DIST(g) / 2;
  let cd = 0, ct = 0, tHalf = null;
  for (let i = 0; i < rec.laps.length; i++) {
    if (cd + d[i] >= half) { tHalf = ct + rec.laps[i] * (half - cd) / d[i]; break; }
    cd += d[i]; ct += rec.laps[i];
  }
  const total = rec.laps.reduce((a, b) => a + b, 0);
  if (!tHalf) return null;
  const ratio = (total - tHalf) / tHalf;
  const type = ratio < 0.985 ? '後半ペースアップ' : ratio <= 1.05 ? 'イーブンペース' : '前半飛ばし';
  return { ratio, type, first: tHalf, second: total - tHalf, per100: rec.laps.map((t, i) => t / d[i] * 100) };
}
const paceCls = t => t === '後半ペースアップ' ? 'g' : t === 'イーブンペース' ? '' : 'o';

/* ================= グラフ（SVG） ================= */
function range(vals, padRatio = .12) { let a = Math.min(...vals), b = Math.max(...vals); if (a === b) { a -= 1; b += 1; } const p = (b - a) * padRatio; return [a - p, b + p]; }
function ticks(a, b, n = 4) { const out = []; for (let i = 0; i <= n; i++) out.push(a + (b - a) * i / n); return out; }
function lineChart(pts, o = {}) {
  if (!pts.length) return '<div class="empty">データがありません</div>';
  const W = 640, H = o.h || 250, L = 58, R = 18, T = 14, B = 34, fy = o.fy || (v => fmt(v));
  const refs = o.refs || [];
  const [y0, y1] = range(pts.map(p => p.y).concat(refs.map(r => r.y)));
  const sx = i => pts.length === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (pts.length - 1);
  const sy = v => o.invert ? T + (v - y0) / (y1 - y0) * (H - T - B) : H - B - (v - y0) / (y1 - y0) * (H - T - B);
  let s = '';
  ticks(y0, y1).forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="#eef1f5"/><text x="${L - 8}" y="${sy(v) + 4}" text-anchor="end">${fy(v)}</text>`; });
  refs.forEach(r => { s += `<line x1="${L}" x2="${W - R}" y1="${sy(r.y)}" y2="${sy(r.y)}" stroke="${r.color || '#f26a21'}" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W - R - 4}" y="${sy(r.y) - 5}" text-anchor="end" style="fill:${r.color || '#b8480c'};font-weight:700">${esc(r.label)}</text>`; });
  const step = Math.ceil(pts.length / 10);
  pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) s += `<text x="${sx(i)}" y="${H - 10}" text-anchor="middle">${esc(p.label)}</text>`; });
  s += `<polyline fill="none" stroke="#13315c" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p, i) => sx(i) + ',' + sy(p.y)).join(' ')}"/>`;
  pts.forEach((p, i) => { s += `<circle cx="${sx(i)}" cy="${sy(p.y)}" r="${p.hl ? 6 : 4.5}" fill="${p.hl ? '#f26a21' : '#fff'}" stroke="${p.hl ? '#f26a21' : '#13315c'}" stroke-width="2"><title>${esc(p.label)}：${fy(p.y)}</title></circle>`; });
  if (o.invert) s += `<text x="${L}" y="${T - 2}" style="font-size:11px">↑速い</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg>`;
}
function scatter(pts, o = {}) {
  if (pts.length < 2) return '<div class="empty">データが2つ以上たまるとグラフになります</div>';
  const W = 640, H = o.h || 260, L = 58, R = 18, T = 16, B = 42, fy = o.fy || (v => fmt(v)), fx = o.fx || (v => r1(v));
  const [x0, x1] = range(pts.map(p => p.x), .08), [y0, y1] = range(pts.map(p => p.y));
  const sx = v => L + (v - x0) / (x1 - x0) * (W - L - R);
  const sy = v => o.invert ? T + (v - y0) / (y1 - y0) * (H - T - B) : H - B - (v - y0) / (y1 - y0) * (H - T - B);
  let s = '';
  ticks(y0, y1).forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="#eef1f5"/><text x="${L - 8}" y="${sy(v) + 4}" text-anchor="end">${fy(v)}</text>`; });
  ticks(x0, x1, 5).forEach(v => { s += `<text x="${sx(v)}" y="${H - 22}" text-anchor="middle">${fx(v)}</text>`; });
  if (o.xLabel) s += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle" style="font-weight:700">${esc(o.xLabel)}</text>`;
  if (pts.length >= 3) { const { a, b } = linreg(pts.map(p => p.x), pts.map(p => p.y)); s += `<line x1="${sx(x0)}" y1="${sy(a + b * x0)}" x2="${sx(x1)}" y2="${sy(a + b * x1)}" stroke="#f26a21" stroke-width="2" stroke-dasharray="6 4"/>`; }
  pts.forEach(p => { s += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${o.r || 5.5}" fill="${p.c || '#13315c'}" fill-opacity="${o.op || .8}"><title>${esc(p.label || '')} ${fx(p.x)} / ${fy(p.y)}</title></circle>`; });
  if (o.invert) s += `<text x="${L}" y="${T - 4}" style="font-size:11px">↑速い</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg>`;
}
function bars(items, o = {}) {
  if (!items.length) return '<div class="empty">データがありません</div>';
  const W = 640, H = o.h || 230, L = o.L || 46, R = 12, T = 22, B = 34, fv = o.fv || (v => r1(v));
  const vals = items.map(i => i.value); const lo = o.min != null ? o.min : 0; const hi = Math.max(...vals, 0) * 1.12 || 1;
  const bw = (W - L - R) / items.length;
  const sy = v => H - B - (v - lo) / (hi - lo) * (H - T - B);
  let s = '';
  ticks(lo, hi, 4).forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="#eef1f5"/><text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end">${fv(v)}</text>`; });
  items.forEach((it, i) => {
    const x = L + i * bw + bw * .15, w = bw * .7, base = lo < 0 ? 0 : lo;
    const y = sy(Math.max(it.value, base)), y2 = sy(Math.min(it.value, base));
    s += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(1, y2 - y)}" rx="4" fill="${it.color || '#13315c'}"><title>${esc(it.label)}：${fv(it.value)}</title></rect>`;
    if (o.showV !== false) s += `<text x="${x + w / 2}" y="${y - 5}" text-anchor="middle" style="font-weight:700;fill:#122033">${it.vlabel != null ? esc(it.vlabel) : fv(it.value)}</text>`;
    s += `<text x="${x + w / 2}" y="${H - 12}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg>`;
}
function lapChart(rec, g) {
  const pc = pacing(rec, g); if (!pc) return '<div class="muted">ラップの記録がありません（最終タイムのみ）</div>';
  const avg = rec.time / DIST(g) * 100;
  const items = pc.per100.map((v, i) => ({ label: (i + 1) + '周', value: v, vlabel: v.toFixed(1), color: v > avg * 1.03 ? '#f26a21' : v < avg * .97 ? '#1a9a6c' : '#13315c' }));
  return bars(items, { h: 200, min: Math.min(...pc.per100) * .85, fv: v => v.toFixed(0) }) + `<div class="muted">100mあたりの秒数（低いほど速い）／平均 ${avg.toFixed(1)}秒。緑＝平均より速い周、オレンジ＝遅い周</div>`;
}
function rText(r) {
  if (r == null) return '計算できません';
  const a = Math.abs(r);
  return a >= .7 ? '強い関係' : a >= .4 ? 'ある程度の関係' : a >= .2 ? '弱い関係' : 'ほとんど関係なし';
}

function tabsFor() {

function analyzeFactor(rs, key, g) {

  const caution = data.length < 4 ? `<div class="note" style="margin-top:8px">まだデータが <strong>${data.length}回分</strong> です。4回以上たまると、傾向が読み取りやすくなります。</div>` : '';
  if (!f || f.type === 'none') return '';

    const pts = data.map(x => ({ x: x.v, y: x.r.time, label: md(x.r.date) }));
    const r = corr(pts.map(p => p.x), pts.map(p => p.y));
    let msg = '';
    if (r != null) {
      const dir = r < 0 ? `<strong>${f.type === 'pace' ? '後半の比率' : f.label}が大きいほどタイムが短い（速い）</strong>` : `<strong>${f.type === 'pace' ? '後半の比率' : f.label}が大きいほどタイムが長い（遅い）</strong>`;
      msg = `相関係数 r = <strong class="num">${r.toFixed(2)}</strong>（${rText(r)}）。${Math.abs(r) >= .2 ? dir + ' 傾向があります。' : 'はっきりした傾向は見えません。'}`;
    }
    const xl = f.type === 'pace' ? '後半÷前半の時間（1.00＝イーブン、大きいほど後半に落ちた）' : f.label + (f.unit ? '（' + f.unit + '）' : '');

      `<div class="note b" style="margin-top:8px">${msg || '計算にはデータが3回分以上必要です。'}${key !== 'order' ? '<br><span class="muted">※回数を重ねるだけでも速くなることがあります。「練習の回数」の影響とも比べてみよう。</span>' : ''}</div>` + caution;

/* ================= 教員：共通 ================= */
function students() {
  const A = S.boot.all, f = S.f;
  return A.roster.filter(s => (!f.grade || String(s.grade) === f.grade) && (!f.cls || String(s.cls) === f.cls) && (!f.gender || s.gender === f.gender));
}
function summarize(s) {
  const A = S.boot.all;
  const rs = sortRecs(A.records.filter(r => r.email === s.email && r.time));
  const hs = realH(A.hypotheses.filter(h => h.email === s.email));
  const o = { s, rs, n: rs.length, hyp: hs.length, hypDone: hs.filter(h => h.conclusion).length };
  if (rs.length) {
    o.first = rs[0].time; o.best = Math.min(...rs.map(r => r.time)); o.latest = rs[rs.length - 1].time;
    o.gain = o.first - o.best; o.gainPct = o.gain / o.first * 100;
    o.score = scoreFor(s.gender, basisTime(rs)); o.off = offScore(s.gender, o.best);
    o.refl = rs.filter(r => r.reflection).length / rs.length;
    const pc = pacing(rs[rs.length - 1], s.gender); o.pace = pc ? pc.type : '';
  }
  return o;
}

  const R = S.boot.all.roster; const f = S.f;

function vTRank() {
  const R = S.boot.all.roster;
  const grades = [...new Set(R.map(r => r.grade))].sort(cmpJa);
  const scopes = [];
  if (grades.some(g => g.startsWith('中'))) scopes.push('中学全体');
  if (grades.some(g => g.startsWith('高'))) scopes.push('高校全体');
  scopes.push(...grades);
  const rk = S.rk || (S.rk = { scope: scopes.includes('高校全体') ? '高校全体' : scopes[0], kind: 'best', n: 10 });
  if (!scopes.includes(rk.scope)) rk.scope = scopes[0];
  const inScope = s => rk.scope === '中学全体' ? s.grade.startsWith('中') : rk.scope === '高校全体' ? s.grade.startsWith('高') : s.grade === rk.scope;
  const all = R.filter(inScope).map(summarize).filter(o => o.n);
  const K = { best: { l: '自己ベスト', v: o => o.best, asc: true, f: o => fmt(o.best, 1) }, gain: { l: '伸び率', v: o => o.gainPct, asc: false, f: o => '−' + o.gainPct.toFixed(1) + '%' }, latest: { l: '最新の記録', v: o => o.latest, asc: true, f: o => fmt(o.latest, 1) } }[rk.kind];
  const table = g => {
    const list = all.filter(o => o.s.gender === g).sort((a, b) => K.asc ? K.v(a) - K.v(b) : K.v(b) - K.v(a));
    let rank = 0, prev = null;
    const rows = list.slice(0, rk.n === 0 ? list.length : rk.n).map((o, i) => { const v = K.v(o); if (v !== prev) rank = i + 1; prev = v;
      const medal = rank === 1 ? '#d4a017' : rank === 2 ? '#9aa4ae' : rank === 3 ? '#c07a43' : '';
      return `<tr class="click" data-act="stu" data-e="${esc(o.s.email)}"><td style="width:46px"><span style="display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;${medal ? `background:${medal};color:#fff` : 'background:var(--soft)'}">${rank}</span></td>
        <td>${esc(cn(o.s))}</td><td><strong>${esc(o.s.name)}</strong></td><td class="r num" style="font-size:16px"><strong>${K.f(o)}</strong></td>
        <td class="r num muted">${rk.kind === 'gain' ? fmt(o.first) + '→' + fmt(o.best) : '伸び −' + o.gain.toFixed(1) + '秒'}</td><td class="r">${o.n}回</td></tr>`; }).join('');
    const avg = list.length ? mean(list.map(o => o.best)) : null;
    return `<div class="card"><h2>${GL(g)}（${DIST(g)}m）<span class="muted" style="font-weight:400">記録あり ${list.length}人${avg ? '・平均ベスト ' + fmt(avg) : ''}</span></h2>
      ${rows ? `<div class="tw" style="max-height:none"><table class="t">${rows}</table></div>` : '<div class="empty">該当なし</div>'}</div>`;
  };
  // 学年ごとのトップ（各学年の1位）
  const tops = grades.filter(gr => rk.scope.endsWith('全体') ? (rk.scope === '中学全体' ? gr.startsWith('中') : gr.startsWith('高')) : gr === rk.scope).map(gr => {
    const sub = R.filter(s => s.grade === gr).map(summarize).filter(o => o.n);
    const top = g => { const l = sub.filter(o => o.s.gender === g).sort((a, b) => K.asc ? K.v(a) - K.v(b) : K.v(b) - K.v(a))[0]; return l ? `<strong>${esc(l.s.name)}</strong> <span class="num">${K.f(l)}</span><div class="muted">${esc(cn(l.s))}</div>` : '<span class="muted">—</span>'; };
    return `<tr><td><strong>${esc(gr)}</strong></td><td>${top('M')}</td><td>${top('F')}</td></tr>`;
  }).join('');
  return `<div class="card"><div class="row"><h2 style="margin:0">ランキング</h2><span class="sp"></span><button class="btn sm" onclick="window.print()">印刷</button></div>
    <div class="row" style="margin-top:12px"><div class="seg">${scopes.map(sc => `<button data-act="rkSet" data-k="scope" data-v="${esc(sc)}" class="${rk.scope === sc ? 'on' : ''}">${esc(sc)}</button>`).join('')}</div></div>
    <div class="row" style="margin-top:10px"><div class="seg">${[['best', '自己ベスト'], ['gain', '伸び率'], ['latest', '最新の記録']].map(([k, l]) => `<button data-act="rkSet" data-k="kind" data-v="${k}" class="${rk.kind === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="seg">${[[10, 'トップ10'], [20, 'トップ20'], [0, '全員']].map(([k, l]) => `<button data-act="rkSet" data-k="n" data-v="${k}" class="${rk.n === k ? 'on' : ''}">${l}</button>`).join('')}</div></div></div>
  ${tops ? `<div class="card"><h2>学年ごとの1位（${K.l}）</h2><div class="tw" style="max-height:none"><table class="t"><tr><th>学年</th><th>男子 1500m</th><th>女子 1000m</th></tr>${tops}</table></div></div>` : ''}
  <div class="grid g2">${table('M')}${table('F')}</div>`;
}

/* ================= 教員：採点 ================= */
function vTScore() {
  const ed = S.scoreEd || (S.scoreEd = { rows: S.boot.scoreTable.map(r => Object.assign({}, r)), basis: S.boot.settings.basis });
  const col = g => {
    const rows = ed.rows.map((r, i) => Object.assign({ i }, r)).filter(r => r.gender === g).sort((a, b) => b.points - a.points);
    const list = S.boot.all.roster.filter(s => s.gender === g).map(summarize).filter(o => o.n);
    return `<div class="card"><h2>${GL(g)}（${DIST(g)}m）</h2>
      <table class="t"><tr><th>点数</th><th>この時間以内（分:秒）</th><th class="r">該当人数</th><th></th></tr>
      ${rows.map(r => { const cnt = list.filter(o => scoreFor2(ed.rows, g, basisTime(o.rs)) === r.points).length; return `<tr><td><input type="number" style="width:70px" value="${r.points}" data-act-change="scE" data-i="${r.i}" data-k="points"></td>
        <td><input type="text" style="width:110px" value="${r.limit >= 5999 ? '' : fmt(r.limit)}" placeholder="それより遅い" data-act-change="scE" data-i="${r.i}" data-k="limit"></td><td class="r">${cnt}人</td><td><button class="btn sm dang" data-act="scDel" data-i="${r.i}">×</button></td></tr>`; }).join('')}</table>
      <div class="row" style="margin-top:8px"><button class="btn sm" data-act="scAdd" data-g="${g}">＋ 行を追加</button></div></div>`;
  };
  return `<div class="card"><h2>学校オリジナルの採点基準</h2>
    <p class="muted" style="margin-top:0">新体力テストの得点表とは別に、学校独自の基準を設定できます。上から順に「この時間以内なら○点」で判定し、最後の行（空欄）は「それより遅い」場合の点数です。</p>
    <div class="row"><label class="f">採点に使う記録<select data-act-change="scBasis"><option value="best" ${ed.basis === 'best' ? 'selected' : ''}>自己ベスト</option><option value="latest" ${ed.basis === 'latest' ? 'selected' : ''}>最新の記録</option></select></label><span class="sp"></span><button class="btn" data-act="scReset">元に戻す</button><button class="btn pri" data-act="scSave">保存して反映</button></div></div>
  <div class="grid g2">${col('M')}${col('F')}</div>`;
}
function scoreFor2(rows, g, t) { if (t == null) return null; const rs = rows.filter(r => r.gender === g).sort((a, b) => a.limit - b.limit); for (const r of rs) if (t <= r.limit) return r.points; return rs.length ? Math.min(...rs.map(r => r.points)) : null; }
CHG.scE = t => { const r = S.scoreEd.rows[Number(t.dataset.i)]; if (t.dataset.k === 'points') r.points = Number(t.value); else { const v = parseTime(t.value); r.limit = v && v > 0 ? v : 5999; } render(); };
CHG.scBasis = t => { S.scoreEd.basis = t.value; render(); };
ACT.scAdd = d => { S.scoreEd.rows.push({ gender: d.g, points: 0, limit: 600 }); render(); };
ACT.scDel = d => { S.scoreEd.rows.splice(Number(d.i), 1); render(); };
ACT.scReset = () => { S.scoreEd = null; render(); };
ACT.scSave = (d, b) => {
  b.disabled = true;
  api('saveScoreTable', S.scoreEd.rows, S.scoreEd.basis).then(res => { S.boot.scoreTable = res.scoreTable; S.boot.settings = res.settings; S.scoreEd = null; toast('採点基準を保存しました'); render(); }).catch(e => { b.disabled = false; toast(errMsg(e), 1); });
};

/* ================= 教員：設定 ================= */
function vTSet() {

  return `<div class="card" id="setf"><h2>設定</h2>
    <label class="f">アプリ名<input type="text" data-f="title" value="${esc(s.title)}"></label>
    <label class="f" style="margin-top:10px">教員として扱うメール（カンマ区切り）<textarea data-f="teachers" placeholder="teacher1@sakuragaoka.ac.jp, teacher2@...">${esc(s.teachers || '')}</textarea></label>
    <div class="fgrid" style="margin-top:10px">
      <label class="f">男子ラップ（m・合計1500）<input type="text" data-f="lapM" value="${lapStr(s.lapM)}"></label>
      <label class="f">女子ラップ（m・合計1000）<input type="text" data-f="lapF" value="${lapStr(s.lapF)}"></label>
    </div>
    <p class="muted">1周の距離をカンマ区切りで入れます。「100x15」のようにまとめて書くこともできます（1周100mのコースで1500m＝100x15、1000m＝100x10）。1周400mのトラックなら 300,400,400,400。</p>
    <div class="row"><span class="sp"></span><button class="btn pri" data-act="setSave">保存</button></div></div>
  <div class="card"><h2>名簿について</h2><p class="muted" style="margin:0">生徒は最初にアプリを開いたとき、学年・組・番号・氏名・性別を自分で入力して登録します（その人のGoogleアカウントが「名簿」シートの行にひも付きます）。入力ミスはスプレッドシートの「名簿」シートで直接直せます。行ごと削除すると、その生徒はもう一度登録し直せます。先生が先に名簿（email欄は空）を入れておくと、同じ学年・組・番号で登録したときにその行が使われます。</p></div>`;
}
const lapStr = a => a.length && a.every(x => x === a[0]) ? `${a[0]}x${a.length}` : a.join(',');
ACT.setSave = (d, b) => {
  const f = { basis: S.boot.settings.basis }; $$('#setf [data-f]').forEach(i => f[i.dataset.f] = i.value);
  b.disabled = true;
  api('saveSettings', f).then(s => { S.boot.settings = s; toast('保存しました'); render(); }).catch(e => { b.disabled = false; toast(errMsg(e), 1); });
};

/* ================= デモ用データ（Apps Script外で開いたときだけ使う） ================= */
const Mock = (() => {
  let seed = 20261120; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const ME = 'demo.student@sakuragaoka.ac.jp', TE = 'demo.teacher@sakuragaoka.ac.jp';
  let role = 'student';
  const db = {
    settings: { title: '持久走ラボ', teachers: TE, lapM: Array(15).fill(100), lapF: Array(10).fill(100), basis: 'best' },
    score: [], roster: [], records: [], hyps: []
  };
  [[10, 300], [9, 320], [8, 340], [7, 360], [6, 380], [5, 400], [4, 420], [3, 450], [2, 480], [1, 5999]].forEach(p => db.score.push({ gender: 'M', points: p[0], limit: p[1] }));
  [[10, 215], [9, 230], [8, 245], [7, 260], [6, 275], [5, 290], [4, 305], [3, 325], [2, 345], [1, 5999]].forEach(p => db.score.push({ gender: 'F', points: p[0], limit: p[1] }));
  const fam = ['佐藤', '鈴木', '高橋', '田中', '伊藤', '渡辺', '山本', '中村', '小林', '加藤', '吉田', '山田', '佐々木', '山口', '松本', '井上', '木村', '林', '清水', '山崎', '森', '池田', '橋本', '阿部', '石川', '前田', '藤田', '小川', '岡田', '後藤', '長谷川', '村上'];
  const mn = ['陽翔', '蓮', '湊', '悠真', '大和', '颯太', '律', '樹', '蒼', '朝陽', '結翔', '海斗', '奏太', '陸', '隼', '航'];
  const fn = ['陽葵', '凛', '結菜', '芽依', '紬', '葵', '澪', '心春', '美桜', '結衣', '咲良', '莉子', '杏', '彩花', '花音', '柚月'];
  db.roster.push({ email: ME, grade: '高2', cls: '1', no: 1, name: '桜丘 太郎', gender: 'M' });
  let fi = 0;
  [['高2', '1'], ['高2', '2'], ['高2', '3'], ['高1', '1'], ['高1', '2'], ['中3', 'A'], ['中2', 'A'], ['中2', 'B']].forEach(([gr, c], ci) => { for (let n = (ci === 0 ? 2 : 1); n <= 16; n++) {
    const g = rnd() < .5 ? 'M' : 'F';
    db.roster.push({ email: `s${ci}${String(n).padStart(2, '0')}@sakuragaoka.ac.jp`, grade: gr, cls: c, no: n, name: fam[fi++ % fam.length] + ' ' + (g === 'M' ? pick(mn) : pick(fn)), gender: g });
  } });
  const dates = ['2026-10-20', '2026-10-27', '2026-11-04', '2026-11-10', '2026-11-17'];
  const refl = ['前半を抑えたら最後まで粘れた', '2周目で落ちた。次は入りを少しゆっくりにする', '寝不足で体が重かった', 'ペアの声かけで最後上げられた', '前の人について行ったら後半きつかった', 'ウォームアップを長めにしたら1周目が楽だった'];
  let id = 1;
  db.roster.forEach(s => {
    const me = s.email === ME;
    const jr = s.grade.startsWith('中') ? 1.06 : 1;
    const base = (s.gender === 'M' ? (me ? 378 : 320 + rnd() * 130) : 238 + rnd() * 100) * (me ? 1 : jr);
    dates.forEach((d, i) => {
      if (!me && rnd() < .08) return;
      const sleep = Math.round((5 + rnd() * 3.5) * 2) / 2, bf = rnd() > .2, cond = 1 + Math.floor(rnd() * 5), warm = pick([5, 10, 10, 15]), weekly = Math.floor(rnd() * 6) * 30, st = pick(STRATEGIES);
      const front = st === '前半から積極的に' || st === '前の人について行く';
      let t = base * (1 - .016 * i) * (1 - (sleep - 7) * .013) * (bf ? 1 : 1.025) * (1 - (cond - 3) * .008) * (1 - (warm - 10) * .0015) * (1 - weekly / 150 * .01) * (front ? 1.014 : st === '前半は抑えて後半上げる' ? .992 : 1) * (1 + (rnd() - .5) * .03);
      const p = s.gender === 'F' ? db.settings.lapF : db.settings.lapM;
      const k = front ? .16 : st === '前半は抑えて後半上げる' ? -.06 : .05;
      const w = p.map((dd, j) => dd * (1 + k * (j / (p.length - 1) - .5) + (rnd() - .5) * .03) * (j === 0 ? .96 : 1));
      const sw = w.reduce((a, b) => a + b, 0); const laps = w.map(x => r1(t * x / sw)); t = r1(laps.reduce((a, b) => a + b, 0));
      const filled = me ? i < 4 : rnd() < .7;
      db.records.push({ id: 'r' + (id++), created: d + ' 10:' + pad2(10 + i), date: d, email: s.email, name: s.name, recorder: s.email, distance: DIST(s.gender), time: t, laps,
        sleep: filled ? sleep : null, breakfast: filled ? bf : null, condition: filled ? cond : null, warmup: filled ? warm : null, weekly: filled ? weekly : null, rpe: filled ? 5 + Math.floor(rnd() * 5) : null,
        strategy: filled ? st : '', reflection: filled ? pick(refl) : '', comment: '', method: 'ペア計測' });
    });
    if (me) db.hyps.push({ id: 'h1', created: '2026-10-27 12:00', email: ME, factor: 'order', hypothesis: '持久走を毎週くり返せば、体が慣れて記録が少しずつ伸びるだろう', reason: '1回目と2回目で6秒縮んだから', method: '回数とタイムの関係をグラフで見る', conclusion: '仮説は正しそう', discussion: '回数を重ねるごとに記録が伸びた。ただ、伸び方は一定ではなくペース配分を変えた回に大きく伸びたので、回数だけが理由ではなさそう。', updated: '' });
    if (me) db.hyps.push({ id: 'h2', created: '2026-11-05 12:00', email: ME, factor: 'pacing', hypothesis: '前半を抑えて後半に上げれば、後半に失速せず記録が伸びるだろう', reason: '1回目は1周目で飛ばして3周目に大きく落ちたから', method: 'ラップを毎回測り、後半÷前半の比とタイムを比べる', conclusion: '仮説は正しそう', discussion: '後半÷前半が1.0に近い回ほどタイムが良かった。最初の300mを抑える意識が一番効果があった。', updated: '' });
    if (me) db.hyps.push({ id: 'hs', created: '2026-11-18 12:00', email: ME, factor: '__summary', hypothesis: '記録が伸びた一番の理由はペース配分だった。回数を重ねた効果もあるが、1周目を抑えた回に大きく伸びた。', reason: '', method: '', conclusion: '', discussion: '部活の練習でも最初を抑えて一定ペースを意識する。', updated: '' });
    if (me) db.hyps.push({ id: 'hr', created: '2026-11-18 12:00', email: ME, factor: '__recsum', hypothesis: '最初は1周目で飛ばして後半に大きく失速していたが、毎回の感想で「入りをゆっくり」と書き続けたことで、一定ペースで走れるようになり45秒縮めることができた。今後の課題は、ラスト1周でもう一段ペースを上げられるようにすること。', reason: '', method: '', conclusion: '', discussion: '', updated: '' });
    if (!me && rnd() < .5) db.hyps.push({ id: 'h' + (id++), created: '2026-10-28 12:00', email: s.email, factor: pick(['pacing', 'warmup', 'breakfast', 'strategy']), hypothesis: '前半を抑えて一定ペースで走れば、後半に落ちずに記録が伸びるだろう', reason: '', method: '', conclusion: rnd() < .4 ? '仮説は正しそう' : '', discussion: '', updated: '' });
  });
  const meEmail = () => role === 'teacher' ? TE : role === 'new' ? 'new.student@sakuragaoka.ac.jp' : ME;
  const prof = () => db.roster.find(r => r.email === meEmail()) || null;
  const clone = x => JSON.parse(JSON.stringify(x));
  const api = {
    setRole(r) { role = r; },
    getBootstrap() {
      const t = role === 'teacher', e = meEmail(), p = prof();
      const res = { email: e, teacher: t, profile: p, settings: Object.assign({}, db.settings, t ? {} : { teachers: undefined }), scoreTable: t ? db.score : [],
        myRecords: db.records.filter(r => r.email === e), myHypotheses: db.hyps.filter(h => h.email === e),
        runners: t ? db.roster : db.roster.filter(r => p && r.grade === p.grade) };
      if (t) res.all = { roster: db.roster, records: db.records, hypotheses: db.hyps };
      return clone(res);
    },
    registerProfile(p) {
      const e = meEmail(); if (!db.roster.some(r => r.email === e)) db.roster.push({ email: e, grade: p.grade, cls: String(p.cls), no: Number(p.no), name: p.name, gender: p.gender === 'F' ? 'F' : 'M' });
      return api.getBootstrap();
    },
    saveRecord(p) {
      const s = db.roster.find(r => r.email === p.runner); if (!s) throw new Error('走った人が名簿に見つかりません');
      if (!(p.time > 60 && p.time < 3600)) throw new Error('タイムが正しくありません');
      const now = new Date(); const rec = { id: 'r' + (id++), created: today() + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()), date: p.date || today(), email: s.email, name: s.name, recorder: meEmail(), distance: DIST(s.gender), time: r1(p.time), laps: (p.laps || []).map(r1),
        sleep: null, breakfast: null, condition: null, warmup: null, weekly: null, rpe: null, strategy: '', reflection: '', comment: '', method: p.method || 'ペア計測' };
      db.records.push(rec); return rec;
    },
    updateRecord(rid, f) { const r = db.records.find(x => x.id === rid); Object.keys(f).forEach(k => { if (k in r) r[k] = f[k]; }); return r; },
    deleteRecord(rid) { db.records = db.records.filter(x => x.id !== rid); return true; },
    saveHypothesis(h) {
      if (h.id) { const x = db.hyps.find(y => y.id === h.id); Object.assign(x, h); return x; }
      const n = Object.assign({ id: 'h' + (id++), created: today() + ' 12:00', email: meEmail(), conclusion: '', discussion: '' }, h); db.hyps.push(n); return n;
    },
    deleteHypothesis(hid) { db.hyps = db.hyps.filter(h => h.id !== hid); return true; },
    saveSettings(s) { const sum = a => a.reduce((x, y) => x + y, 0); const ex = str => String(str).split(/[,、\s]+/).filter(Boolean).flatMap(t => { const m = t.match(/^(\d+)\s*[x×*]\s*(\d+)$/i); return m ? Array(Number(m[2])).fill(Number(m[1])) : [Number(t)]; }).filter(n => n > 0);
      const lm = ex(s.lapM), lf = ex(s.lapF);
      if (sum(lm) !== 1500) throw new Error('男子ラップの合計が1500mになっていません'); if (sum(lf) !== 1000) throw new Error('女子ラップの合計が1000mになっていません');
      Object.assign(db.settings, { title: s.title, teachers: s.teachers, lapM: lm, lapF: lf }); return db.settings; },
    saveScoreTable(rows, basis) { db.score = rows.map(r => ({ gender: r.gender, points: Number(r.points), limit: Number(r.limit) })); if (basis) db.settings.basis = basis; return { scoreTable: db.score, settings: db.settings }; }
  };
  return api;
})();
