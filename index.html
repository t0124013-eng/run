<title>持久走記録</title>
<style>

  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#demobar{background:#fff7d6;border-bottom:1px solid #f0dc8a;padding:6px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

#demobar button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
header.top{background:var(--navy);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.02em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--orange);display:grid;place-items:center}
#who{font-size:13px;opacity:.9;text-align:right}
nav#tabs{background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;position:sticky;top:0;z-index:5;padding:0 8px}
nav#tabs button{border:0;background:none;padding:13px 16px;cursor:pointer;font-weight:600;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap}
nav#tabs button.on{color:var(--navy);border-bottom-color:var(--orange)}
main{max-width:1100px;margin:0 auto;padding:18px 14px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3{font-size:15px;margin:14px 0 8px}
.muted{color:var(--sub);font-size:13px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .lb{font-size:12px;color:var(--sub);font-weight:600}
.kpi .v{font-size:28px;font-weight:800;line-height:1.2;margin-top:2px}
.kpi .s{font-size:12px;color:var(--sub)}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border:0}
.hero .lb,.hero .s{color:#c9d6ea}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;background:var(--soft);color:var(--navy)}
.pill.o{background:var(--orange-soft);color:#b8480c}.pill.g{background:var(--green-soft);color:#11714e}.pill.r{background:var(--red-soft);color:#a62a2a}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.acc{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.dang{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--sub)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{border:1px solid #cfd7e2;border-radius:9px;padding:8px 10px;background:#fff;min-width:0;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #9db8e6;border-color:#7d9fd8}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.seg{display:inline-flex;border:1px solid #cfd7e2;border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;min-width:38px}
.seg button+button{border-left:1px solid #e2e7ee}
.seg button.on{background:var(--navy);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:var(--soft);text-align:left;padding:8px;font-size:12px;color:var(--sub);white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none}
table.t td{padding:8px;border-top:1px solid var(--line);white-space:nowrap}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#f8fafd}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px}
.r{text-align:right}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:inherit;font-size:12px;fill:#5d6b7c}
.empty{padding:28px;text-align:center;color:var(--sub);background:var(--soft);border-radius:10px}
details.rec{scroll-margin-top:64px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
details.rec>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details.rec>summary::-webkit-details-marker{display:none}
details.rec[open]>summary{border-bottom:1px solid var(--line)}
details.rec .body{padding:14px}
.big{font-size:24px;font-weight:800}
.note{background:var(--orange-soft);border-left:4px solid var(--orange);padding:10px 12px;border-radius:8px;font-size:14px}
.note.b{background:#eaf1fc;border-color:var(--blue)}
.note.g{background:var(--green-soft);border-color:var(--green)}
.cmt{background:#eaf1fc;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px}

.sw{text-align:center}
.sw .clock{font-size:clamp(56px,16vw,110px);font-weight:800;letter-spacing:.01em;line-height:1.05;margin:8px 0}

.tap{width:100%;max-width:520px;height:150px;border-radius:24px;border:0;font-size:32px;font-weight:800;color:#fff;cursor:pointer;margin:14px auto;display:block;touch-action:manipulation;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.tap:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.tap.start{background:var(--green)}.tap.lap{background:var(--orange)}.tap.goal{background:var(--red)}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;background:#fff}
.chip.done{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.now{border-color:var(--orange);color:#b8480c;font-weight:700}
.runners{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:340px;overflow:auto}
.runners button{text-align:left;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px;cursor:pointer}
.runners button:hover{border-color:var(--navy)}
.runners button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
/* modal */
#modal{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
#modal[hidden]{display:none}
#modal .box{background:#fff;border-radius:16px;max-width:900px;width:100%;padding:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;transition:transform .25s;z-index:60;max-width:90vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--orange)}
.loading{padding:60px;text-align:center;color:var(--sub)}
.step{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.step b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:13px}
@media (max-width:600px){ main{padding:12px 10px 80px} .card{padding:14px} .kpi .v{font-size:24px} }
/* A3まとめ */
.pv{width:100%;aspect-ratio:1587/1123;overflow:hidden;position:relative;border:1px solid var(--line);border-radius:8px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.pv .sheet{position:absolute;left:0;top:0;transform-origin:0 0}
.sheet{width:1587px;height:1123px;background:#fff;color:#122033;padding:34px 40px;display:flex;flex-direction:column;font-size:15px;line-height:1.55;overflow:hidden}
.sheet .hd{display:flex;align-items:flex-end;gap:24px;border-bottom:4px solid #13315c;padding-bottom:12px}
.sheet .hd h1{margin:0;font-size:36px;letter-spacing:.04em;color:#13315c}
.sheet .hd .meta{font-size:16px;color:#3c4b5d}
.sheet .hd .badge{margin-left:auto;text-align:center;background:#f26a21;color:#fff;border-radius:14px;padding:6px 20px}
.sheet .hd .badge b{display:block;font-size:34px;line-height:1.1}
.sheet .cols{flex:1;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:22px;margin-top:16px;min-height:0}
.sheet .col{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.sheet h2{margin:0;font-size:19px;color:#fff;background:#13315c;border-radius:8px;padding:5px 12px}
.sheet h2 span{color:#f9a46f;margin-right:6px}
.sheet .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet .kp div{border:1px solid #dfe5ed;border-radius:10px;padding:6px 10px}
.sheet .kp small{display:block;font-size:12px;color:#5d6b7c;font-weight:700}
.sheet .kp b{font-size:22px}
.sheet table{width:100%;border-collapse:collapse;font-size:13px}
.sheet th{background:#eef2f7;text-align:left;padding:4px 6px;font-size:12px;color:#5d6b7c}
.sheet td{border-top:1px solid #e2e7ee;padding:4px 6px}
.sheet .hy{border:1.5px solid #dfe5ed;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.sheet .hy .q{font-weight:800;font-size:16px}
.sheet .hy .s{font-size:13px;color:#3c4b5d;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sheet .hy .d{font-size:13.5px;background:#f6f8fb;border-radius:8px;padding:6px 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sheet .box{border:1.5px solid #dfe5ed;border-radius:12px;padding:10px 12px;white-space:pre-wrap;font-size:14.5px;overflow:hidden}
.sheet .box.lg{flex:1}
.sheet .lb{font-size:13px;font-weight:800;color:#b8480c;margin-bottom:2px}
.sheet .pill{font-size:12px}
.sheet svg.chart text{fill:#5d6b7c}
.sheet.rec .cols{grid-template-columns:360px 1fr}
.sheet .rtw{flex:1;min-height:0}
.sheet table.rt{font-size:13.5px;table-layout:fixed;height:100%}
.sheet table.rt td{vertical-align:top;padding:6px 7px}
.sheet table.rt th{height:30px}
.sheet table.rt .ref{white-space:pre-wrap;font-size:15px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.sheet table.rt tr:nth-child(even) td{background:#fafbfd}
#printArea{display:none}
#pdfHost{position:fixed;left:-20000px;top:0}
@media print{
  nav,#demobar,.noprint{display:none!important}
  @page{size:A3 landscape;margin:0}
  body.print-a3{background:#fff}
  body.print-a3>*:not(#printArea){display:none!important}
  body.print-a3 #printArea{display:block}
  body.print-a3 .sheet{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<script>
/* 読み込みが終わらないときの原因表示（本体のプログラムとは別に動く） */
(function () {
  var shown = false;
  var tips = '<ul style="margin:8px 0 0;padding-left:1.2em;line-height:1.9">' +
    '<li>ページを再読み込みしてみてください。</li>' +
    '<li>プライベートブラウズ（シークレット）では使えません。通常の画面で開いてください。</li>' +
    '<li>直らないときは、先生に画面を見せてください。</li></ul>';
  window.__loadFail = function (msg) {
    if (shown) return; var m = document.getElementById('main'); if (!m) return; shown = true;
    m.innerHTML = '<div class="card" style="max-width:720px;margin:20px auto"><h2>読み込めませんでした</h2><p>' + msg + '</p>' + tips +
      '<p style="margin-top:12px"><button class="btn" onclick="location.reload()">再読み込み</button></p></div>';
  };
  window.addEventListener('error', function (e) {
    window.__loadFail('画面のプログラムでエラーが起きました：' + (e && e.message ? e.message : '') + (e && e.lineno ? '（' + e.lineno + '行目）' : ''));
  });
  window.__bootTimer = setTimeout(function () {
    if (document.querySelector('#main .loading')) window.__loadFail('30秒たっても応答がありません。');
  }, 30000);
})();
</script>

<script>
'use strict';
/* ================= 基本ユーティリティ ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(sec, dec = 0) {
  if (sec == null || isNaN(sec)) return '—';
  const neg = sec < 0; sec = Math.abs(sec);
  const p = Math.pow(10, dec); let v = Math.round(sec * p) / p;
  const m = Math.floor(v / 60); const s = v - m * 60;
  let ss = s.toFixed(dec); const [i, f] = ss.split('.');
  return (neg ? '-' : '') + m + ':' + i.padStart(2, '0') + (f ? '.' + f : '');
}
function parseTime(str) {
  str = String(str || '').trim().replace(/：/g, ':').replace(/分/, ':').replace(/秒/, '').replace(/[’'′]/, ':').replace(/[”"″]/, '');
  if (!str) return null;
  if (str.includes(':')) { const [m, s] = str.split(':'); const v = Number(m) * 60 + Number(s || 0); return isNaN(v) ? null : v; }
  const v = Number(str); return isNaN(v) ? null : v;
}
const pad2 = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const md = d => d ? Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10)) : '';
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const r1 = n => Math.round(n * 10) / 10;
function corr(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = mean(xs), my = mean(ys); let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { const dx = xs[i] - mx, dy = ys[i] - my; sxy += dx * dy; sxx += dx * dx; syy += dy * dy; }
  return (sxx && syy) ? sxy / Math.sqrt(sxx * syy) : null;
}
function linreg(xs, ys) { const mx = mean(xs), my = mean(ys); let sxy = 0, sxx = 0; xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; }); const b = sxx ? sxy / sxx : 0; return { a: my - b * mx, b }; }
function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => t.className = '', 2600); }
function api(fn, ...args) { return new Promise((res, rej) => setTimeout(() => { try { res(JSON.parse(JSON.stringify(Store[fn](...args)))); } catch (e) { rej(e); } }, 0)); }
const errMsg = e => (e && e.message) ? e.message : String(e);
const sortRecs = rs => rs.slice().sort((a, b) => (a.date + a.created).localeCompare(b.date + b.created));
const DIST = g => (S.boot && S.boot.settings && S.boot.settings.distM) ? (g === 'F' ? S.boot.settings.distF : S.boot.settings.distM) : (g === 'F' ? 1000 : 1500);
const gk = x => String(x).replace(/^中/, '0').replace(/^高/, '1');
const cmpJa = (a, b) => gk(a).localeCompare(gk(b), 'ja', { numeric: true });
const stuKey = x => [x.grade, x.cls, x.no];
const cmpStu = (a, b) => cmpJa(a.grade, b.grade) || cmpJa(a.cls, b.cls) || (a.no - b.no);
const cn = x => `${x.grade} ${x.cls}組${x.no}番`;
const cls2 = k => { const [g, c] = k.split('-'); return `${g} ${c}組`; };
const GL = g => g === 'F' ? '女子' : '男子';

/* ================= 状態 ================= */
const GRADES = ['中1', '中2', '中3', '高1', '高2', '高3'];
const S = { boot: null, tab: null, sw: null, pick: { cls: '', friend: false }, openRec: null, editHyp: null, aFactor: 'pacing' };
const plan = g => (g === 'F' ? S.boot.settings.lapF : S.boot.settings.lapM);

/* ================= 新体力テストの得点（表示のみ） ================= */
// 新体力テスト（12〜19歳）項目別得点表：持久走（スポーツ庁）。記録は秒未満切り上げで判定
const OFFICIAL = { M: [[10, 299], [9, 316], [8, 333], [7, 355], [6, 382], [5, 410], [4, 450], [3, 499], [2, 560], [1, 1e9]], F: [[10, 229], [9, 242], [8, 259], [7, 277], [6, 296], [5, 318], [4, 342], [3, 374], [2, 417], [1, 1e9]] };
const offOK = g => DIST(g) === (g === 'F' ? 1000 : 1500);
function offScore(g, t) { if (t == null || !offOK(g)) return null; const sec = Math.ceil(t - 1e-9); for (const [p, lim] of OFFICIAL[g]) if (sec <= lim) return p; return 1; }
function offNext(g, t) { const cur = offScore(g, t); if (cur == null || cur >= 10) return null; const row = OFFICIAL[g].find(r => r[0] === cur + 1); return { points: cur + 1, limit: row[1], need: Math.ceil(t - 1e-9) - row[1] }; }

/* ================= ペース分析・グラフ ================= */
/* ================= ペース分析 ================= */
const RD = (rec, g) => rec.distance || DIST(g);
function lapDists(rec, g) {
  const n = rec.laps.length, D = RD(rec, g);
  if (rec.lapDists && rec.lapDists.length === n) return rec.lapDists;
  const p = buildLaps(D, S.boot.settings.lap); if (n === p.length) return p;
  if (D === DIST(g) && plan(g).length === n) return plan(g);
  return rec.laps.map(() => D / n);
}
function pacing(rec, g) {
  if (!rec.laps || rec.laps.length < 2) return null;
  const d = lapDists(rec, g); const half = RD(rec, g) / 2;
  let cd = 0, ct = 0, tHalf = null;
  for (let i = 0; i < rec.laps.length; i++) {
    if (cd + d[i] >= half) { tHalf = ct + rec.laps[i] * (half - cd) / d[i]; break; }
    cd += d[i]; ct += rec.laps[i];
  }
  const total = rec.laps.reduce((a, b) => a + b, 0);
  if (!tHalf) return null;
  const ratio = (total - tHalf) / tHalf;
  const type = ratio < 0.985 ? '後半ペースアップ' : ratio <= 1.05 ? 'イーブンペース' : '前半飛ばし';
  return { ratio, type, first: tHalf, second: total - tHalf, per100: rec.laps.map((t, i) => t / d[i] * 100) };
}
const paceCls = t => t === '後半ペースアップ' ? 'g' : t === 'イーブンペース' ? '' : 'o';

/* ================= グラフ（SVG） ================= */
function range(vals, padRatio = .12) { let a = Math.min(...vals), b = Math.max(...vals); if (a === b) { a -= 1; b += 1; } const p = (b - a) * padRatio; return [a - p, b + p]; }
function ticks(a, b, n = 4) { const out = []; for (let i = 0; i <= n; i++) out.push(a + (b - a) * i / n); return out; }
function lineChart(pts, o = {}) {
  if (!pts.length) return '<div class="empty">データがありません</div>';
  const W = 640, H = o.h || 250, L = 58, R = 18, T = 14, B = 34, fy = o.fy || (v => fmt(v));
  const refs = o.refs || [];
  const [y0, y1] = range(pts.map(p => p.y).concat(refs.map(r => r.y)));
  const sx = i => pts.length === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (pts.length - 1);
  const sy = v => o.invert ? T + (v - y0) / (y1 - y0) * (H - T - B) : H - B - (v - y0) / (y1 - y0) * (H - T - B);
  let s = '';
  ticks(y0, y1).forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="#eef1f5"/><text x="${L - 8}" y="${sy(v) + 4}" text-anchor="end">${fy(v)}</text>`; });
  refs.forEach(r => { s += `<line x1="${L}" x2="${W - R}" y1="${sy(r.y)}" y2="${sy(r.y)}" stroke="${r.color || '#f26a21'}" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W - R - 4}" y="${sy(r.y) - 5}" text-anchor="end" style="fill:${r.color || '#b8480c'};font-weight:700">${esc(r.label)}</text>`; });
  const step = Math.ceil(pts.length / 10);
  pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) s += `<text x="${sx(i)}" y="${H - 10}" text-anchor="middle">${esc(p.label)}</text>`; });
  s += `<polyline fill="none" stroke="#13315c" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p, i) => sx(i) + ',' + sy(p.y)).join(' ')}"/>`;
  pts.forEach((p, i) => { s += `<circle cx="${sx(i)}" cy="${sy(p.y)}" r="${p.hl ? 6 : 4.5}" fill="${p.hl ? '#f26a21' : '#fff'}" stroke="${p.hl ? '#f26a21' : '#13315c'}" stroke-width="2"><title>${esc(p.label)}：${fy(p.y)}</title></circle>`; });
  if (o.invert) s += `<text x="${L}" y="${T - 2}" style="font-size:11px">↑速い</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg>`;
}
function scatter(pts, o = {}) {
  if (pts.length < 2) return '<div class="empty">データが2つ以上たまるとグラフになります</div>';
  const W = 640, H = o.h || 260, L = 58, R = 18, T = 16, B = 42, fy = o.fy || (v => fmt(v)), fx = o.fx || (v => r1(v));
  const [x0, x1] = range(pts.map(p => p.x), .08), [y0, y1] = range(pts.map(p => p.y));
  const sx = v => L + (v - x0) / (x1 - x0) * (W - L - R);
  const sy = v => o.invert ? T + (v - y0) / (y1 - y0) * (H - T - B) : H - B - (v - y0) / (y1 - y0) * (H - T - B);
  let s = '';
  ticks(y0, y1).forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="#eef1f5"/><text x="${L - 8}" y="${sy(v) + 4}" text-anchor="end">${fy(v)}</text>`; });
  ticks(x0, x1, 5).forEach(v => { s += `<text x="${sx(v)}" y="${H - 22}" text-anchor="middle">${fx(v)}</text>`; });
  if (o.xLabel) s += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle" style="font-weight:700">${esc(o.xLabel)}</text>`;
  if (pts.length >= 3) { const { a, b } = linreg(pts.map(p => p.x), pts.map(p => p.y)); s += `<line x1="${sx(x0)}" y1="${sy(a + b * x0)}" x2="${sx(x1)}" y2="${sy(a + b * x1)}" stroke="#f26a21" stroke-width="2" stroke-dasharray="6 4"/>`; }
  pts.forEach(p => { s += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${o.r || 5.5}" fill="${p.c || '#13315c'}" fill-opacity="${o.op || .8}"><title>${esc(p.label || '')} ${fx(p.x)} / ${fy(p.y)}</title></circle>`; });
  if (o.invert) s += `<text x="${L}" y="${T - 4}" style="font-size:11px">↑速い</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg>`;
}
function bars(items, o = {}) {
  if (!items.length) return '<div class="empty">データがありません</div>';
  const W = 640, H = o.h || 230, L = o.L || 46, R = 12, T = 22, B = 34, fv = o.fv || (v => r1(v));
  const vals = items.map(i => i.value); const lo = o.min != null ? o.min : 0; const hi = Math.max(...vals, 0) * 1.12 || 1;
  const bw = (W - L - R) / items.length;
  const sy = v => H - B - (v - lo) / (hi - lo) * (H - T - B);
  let s = '';
  ticks(lo, hi, 4).forEach(v => { s += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="#eef1f5"/><text x="${L - 6}" y="${sy(v) + 4}" text-anchor="end">${fv(v)}</text>`; });
  items.forEach((it, i) => {
    const x = L + i * bw + bw * .15, w = bw * .7, base = lo < 0 ? 0 : lo;
    const y = sy(Math.max(it.value, base)), y2 = sy(Math.min(it.value, base));
    s += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(1, y2 - y)}" rx="4" fill="${it.color || '#13315c'}"><title>${esc(it.label)}：${fv(it.value)}</title></rect>`;
    if (o.showV !== false) s += `<text x="${x + w / 2}" y="${y - 5}" text-anchor="middle" style="font-weight:700;fill:#122033">${it.vlabel != null ? esc(it.vlabel) : fv(it.value)}</text>`;
    s += `<text x="${x + w / 2}" y="${H - 12}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg>`;
}
function lapChart(rec, g) {
  const pc = pacing(rec, g); if (!pc) return '<div class="muted">ラップの記録がありません（最終タイムのみ）</div>';
  const avg = rec.time / RD(rec, g) * 100;
  const items = pc.per100.map((v, i) => ({ label: (i + 1) + '周', value: v, vlabel: v.toFixed(1), color: v > avg * 1.03 ? '#f26a21' : v < avg * .97 ? '#1a9a6c' : '#13315c' }));
  return bars(items, { h: 200, min: Math.min(...pc.per100) * .85, fv: v => v.toFixed(0) }) + `<div class="muted">100mあたりの秒数（低いほど速い）／平均 ${avg.toFixed(1)}秒。緑＝平均より速い周、オレンジ＝遅い周</div>`;
}
function rText(r) {
  if (r == null) return '計算できません';
  const a = Math.abs(r);
  return a >= .7 ? '強い関係' : a >= .4 ? 'ある程度の関係' : a >= .2 ? '弱い関係' : 'ほとんど関係なし';
}

function buildLaps(dist, lap) {
  dist = Number(dist); lap = Number(lap);
  if (!(dist > 0) || !(lap > 0) || lap >= dist) return [dist];
  const n = Math.floor(dist / lap), rem = dist - n * lap;
  return (rem > 0 ? [rem] : []).concat(Array(n).fill(lap));
}

async function shareJSON(obj, name) {
  const text = JSON.stringify(obj);
  const file = new File([text], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return true;
}

/* ================= 保存（このiPadのブラウザ内） ================= */
const Store = (() => {
  const KEY = 'jikyuso-kiroku-v1';
  const blank = () => ({ profile: null, distM: 0, distF: 0, lap: 0, records: [], hyps: [], held: [], lastBackup: '' });
  let mem = null;
  const load = () => {
    if (mem) return mem;
    try { mem = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || 'null') || {}); }
    catch (e) { mem = blank(); }
    return mem;
  };
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(mem)); }
    catch (e) { throw new Error('このiPadに保存できませんでした。プライベートブラウズを使っていないか確認してください。'); }
  };
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
  const qp = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(''); } })();
  const qn = (k, lo, hi) => { const v = Number(qp.get(k)); return v >= lo && v <= hi ? v : 0; };
  const URL_SET = { distM: qn('m', 200, 10000), distF: qn('f', 200, 10000), lap: qn('lap', 50, 10000) || ({ '200': 200, '400': 400 }[qp.get('course')] || 0) };
  const cfg = () => { const d = load(); return { distM: d.distM || URL_SET.distM || 1500, distF: d.distF || URL_SET.distF || 1000, lap: d.lap || URL_SET.lap || 100 }; };
  const nowStr = () => { const d = new Date(); return today() + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
  const newId = () => 'r' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
  const cleanRec = r => ({ id: String(r.id || newId()), created: String(r.created || nowStr()), date: /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? r.date : today(), email: 'me',
    name: String(r.name || ''), distance: Number(r.distance) || 0, time: r1(Number(r.time)), laps: (Array.isArray(r.laps) ? r.laps : []).map(Number).filter(n => n > 0).map(r1),
    lapDists: (Array.isArray(r.lapDists) ? r.lapDists : []).map(Number).filter(n => n > 0), reflection: String(r.reflection || '').slice(0, 2000), method: String(r.method || '手入力'), recorder: String(r.recorder || ''), recorderName: String(r.recorderName || '') });
  const api = {
    getBootstrap() {
      const d = load(), c = cfg();
      const profile = d.profile ? Object.assign({ email: 'me', summary: '' }, d.profile) : null;
      return { email: 'me', profile, settings: { title: '持久走記録', distM: c.distM, distF: c.distF, lap: c.lap, lapM: buildLaps(c.distM, c.lap), lapF: buildLaps(c.distF, c.lap) },
        myRecords: d.records, myHypotheses: d.hyps, held: d.held, lastBackup: d.lastBackup, runners: profile ? [profile] : [] };
    },
    saveProfile(f) {
      const d = load();
      d.profile = { grade: f.grade, cls: f.cls, no: f.no, name: f.name, gender: f.gender, summary: d.profile ? d.profile.summary || '' : '' };
      if (f.gender === 'F') d.distF = f.dist || 0; else d.distM = f.dist || 0;
      if (f.lap) d.lap = f.lap;
      d.records.forEach(r => r.name = f.name);
      save(); return api.getBootstrap();
    },
    saveRecord(p) {
      const d = load(), me = d.profile;
      if (!me) throw new Error('先に登録してください');
      if (!(p.time > 60 && p.time < 3600)) throw new Error('タイムが正しくありません');
      const self = p.runner === 'me';
      const run = self ? me : p.runner;
      const c = cfg(), dist = run.gender === 'F' ? c.distF : c.distM;
      const rec = cleanRec({ id: newId(), created: nowStr(), date: p.date, name: run.name, distance: dist, lapDists: buildLaps(dist, c.lap), time: p.time, laps: p.laps || [], method: p.method, recorder: self ? '' : 'me', recorderName: self ? '' : me.name });
      if (self) d.records.push(rec);
      else { rec.email = run.email; rec.runner = { grade: run.grade, cls: run.cls, no: run.no, name: run.name, gender: run.gender }; d.held.push(rec); }
      save(); return rec;
    },
    updateRecord(id, f) { const d = load(), r = d.records.find(x => x.id === id); if (!r) throw new Error('記録が見つかりません'); r.reflection = String(f.reflection || '').slice(0, 2000); save(); return r; },
    deleteRecord(id) { const d = load(); d.records = d.records.filter(x => x.id !== id); save(); return true; },
    deleteHeld(id) { const d = load(); d.held = d.held.filter(x => x.id !== id); save(); return true; },
    saveSummary(t) { const d = load(); d.profile.summary = String(t || '').slice(0, 2000); save(); return d.profile.summary; },
    saveHypothesis(h) {
      const d = load(), keys = ['factor', 'hypothesis', 'reason', 'method', 'conclusion', 'discussion'];
      let x = h.id ? d.hyps.find(y => y.id === h.id) : null;
      if (!x) { x = { id: 'h' + newId().slice(1), created: nowStr(), factor: 'pacing', hypothesis: '', reason: '', method: '', conclusion: '', discussion: '' }; d.hyps.push(x); }
      keys.forEach(k => { if (h[k] != null) x[k] = String(h[k]).slice(0, 2000); });
      x.updated = nowStr(); save(); return x;
    },
    deleteHypothesis(id) { const d = load(); d.hyps = d.hyps.filter(h => h.id !== id); save(); return true; },
    importRecords(list) {
      const d = load(); let n = 0;
      (list || []).forEach(x => {
        if (!(Number(x.time) > 60 && Number(x.time) < 3600)) return;
        if (d.records.some(r => r.id === String(x.id))) return;
        const r = cleanRec(x); r.name = d.profile.name; r.method = r.method === '手入力' ? '手入力' : '代理計測'; r.recorder = r.recorderName ? 'friend' : ''; d.records.push(r); n++;
      });
      save(); return n;
    },
    raw() { const d = load(); return { profile: d.profile, distM: d.distM, distF: d.distF, lap: d.lap, records: d.records, hyps: d.hyps, held: d.held }; },
    markBackup() { load().lastBackup = nowStr(); save(); },
    restore(o) {
      if (!o.profile || !Array.isArray(o.records)) throw new Error('バックアップの中身が正しくありません');
      mem = Object.assign(blank(), { profile: o.profile, distM: Number(o.distM) || 0, distF: Number(o.distF) || 0, lap: Number(o.lap) || 0, records: o.records.map(cleanRec), hyps: Array.isArray(o.hyps) ? o.hyps : [], held: Array.isArray(o.held) ? o.held : [], lastBackup: '' });
      save();
    }
  };
  return api;
})();

boot();

</script>
